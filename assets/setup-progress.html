<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setting up elementary OS</title>
    <!-- Shown by the app on first launch while it unpacks the bundled OS. Must work offline:
         no external scripts, fonts or frames. Progress arrives over a WebSocket from the app. -->
    <style>
      :root {
        --bg: #fafafa;
        --fg: #333333;
        --muted: #7e8087;
        --track: #d4d4d4;
        --accent: #3689e6;
        --error: #c6262e;
        --log-bg: #f2f2f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2b2b2b;
          --fg: #fafafa;
          --muted: #abacae;
          --track: #4d4d4d;
          --accent: #64baff;
          --error: #ed5353;
          --log-bg: #1f1f1f;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter", "Roboto", system-ui, sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px 16px;
        gap: 16px;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        color: var(--accent);
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 32rem;
        line-height: 1.5;
      }
      .bar {
        width: min(28rem, 100%);
        height: 6px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.3s ease;
      }
      .error .bar > div {
        background: var(--error);
      }
      #status {
        min-height: 1.5em;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .error #status {
        color: var(--error);
      }
      button {
        border: none;
        background: none;
        color: var(--accent);
        font: inherit;
        padding: 8px;
        cursor: pointer;
      }
      #log {
        display: none;
        width: min(40rem, 100%);
        max-height: 40vh;
        overflow-y: auto;
        margin: 0;
        padding: 12px;
        border-radius: 8px;
        background: var(--log-bg);
        font: 12px/1.5 ui-monospace, "Roboto Mono", monospace;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .show-log #log {
        display: block;
      }
      .log-error {
        color: var(--error);
      }
    </style>
  </head>

  <body>
    <main id="app">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M9 20h6M12 16v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <h1 id="title">Setting up elementary OS</h1>
      <p id="subtitle">
        This happens once and needs no internet connection. It usually takes a minute or two.
      </p>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="bar"></div>
      </div>
      <p id="status">Connecting…</p>
      <button id="toggle" type="button">Show details</button>
      <pre id="log"></pre>
    </main>

    <script>
      const app = document.getElementById("app");
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const bar = document.getElementById("bar");
      const progressbar = bar.parentElement;
      const statusLine = document.getElementById("status");
      const log = document.getElementById("log");
      const toggle = document.getElementById("toggle");
      const MAX_LOG_LINES = 200;

      toggle.addEventListener("click", () => {
        const shown = app.classList.toggle("show-log");
        toggle.textContent = shown ? "Hide details" : "Show details";
      });

      function appendLog(message, isError) {
        const line = document.createElement("div");
        const time = new Date().toLocaleTimeString();
        line.textContent = `${time}  ${message}`;
        if (isError) line.className = "log-error";
        log.appendChild(line);
        while (log.childElementCount > MAX_LOG_LINES) log.firstChild.remove();
        log.scrollTop = log.scrollHeight;
      }

      function showProgress({ progress, message, isError }) {
        // `progress` counts finished setup stages, but nearly all the time goes into the first
        // one (unpacking the OS), which reports its own percentage in the message.
        const stagePercent = /(\d+)%/.exec(message);
        const overall = Number(progress) || 0;
        const reported = stagePercent && overall < 100 ? Number(stagePercent[1]) : overall;
        const percent = Math.max(0, Math.min(100, reported));
        bar.style.width = `${percent}%`;
        progressbar.setAttribute("aria-valuenow", String(percent));
        statusLine.textContent = message;
        appendLog(message, isError);

        if (isError) {
          app.classList.add("error");
          title.textContent = "Setup could not finish";
          subtitle.textContent =
            "Close the app and open it again to retry. Your files are not affected.";
        } else if (percent === 100) {
          title.textContent = "Starting elementary OS";
          subtitle.textContent = "The desktop will appear in a moment.";
        }
      }

      const params = new URLSearchParams(window.location.search);
      if (params.has("missing-os")) {
        showProgress({
          progress: 0,
          message:
            "This build of the app does not include elementary OS. Build it with scripts/build-rootfs.sh, then rebuild the APK.",
          isError: true,
        });
        subtitle.textContent = "The app cannot start without its bundled operating system.";
      } else {
        const ws = new WebSocket(`ws://127.0.0.1:${params.get("port")}`, "rust-websocket");
        ws.onmessage = (event) => showProgress(JSON.parse(event.data));
        ws.onerror = () => appendLog("Lost connection to the installer", true);
      }
    </script>
  </body>
</html>
