icon: assets/icon.png
android:
  assets:
    # The bundled OS, built by scripts/build-rootfs.sh. Already compressed, so stored as is: the
    # app streams it straight out of the APK on first launch. App bundles carry it in an
    # install-time asset pack, as Google Play limits the base module to 200 MB.
    - path: assets/rootfs/elementary-os-rootfs.tar.xz
      alignment: unaligned
      asset_pack: rootfs
    - assets/rootfs/elementary-os-rootfs.json
    - assets/setup-progress.html
    - assets/unsupported.html
    - assets/ld-linux-aarch64.so.1
    - assets/wireplumber-share.tar
  runtime_libs:
    - assets/libs
  gradle: true
  manifest:
    # Different from upstream Local Desktop (io.github.localdesktop) so both can be installed. The Java
    # service below keeps its app.polarbear class name: JNI symbols in src/android/accessibility.rs
    # are bound to it, and a component's class does not have to match the application ID.
    package: io.github.localdesktop.pantheon
    sdk:
      min_sdk_version: 24
      target_sdk_version: 35
    application:
      label: "Local Desktop: Pantheon"
      theme: "@style/AppTheme"
      extract_native_libs: true # Required for proot invocations
      use_cleartext_traffic: true # Required for connecting to ws://127.0.0.1, see assets/setup-progress.html
      services:
        - name: app.polarbear.KeyboardAccessibilityService
          permission: android.permission.BIND_ACCESSIBILITY_SERVICE
          label: "@string/keyboard_service_label"
          enabled: true
          exported: false
          intent_filters:
            - actions:
                - android.accessibilityservice.AccessibilityService
          meta_data:
            - name: android.accessibilityservice
              resource: "@xml/keyboard_accessibility_service"
      meta_data:
        - name: com.samsung.android.dex.launchwidth
          value: 0
        - name: com.samsung.android.dex.launchheight
          value: 0
        - name: com.samsung.android.sdk.multiwindow.dex.launchwidth
          value: 0
        - name: com.samsung.android.sdk.multiwindow.dex.launchheight
          value: 0
    uses_permission:
      - name: android.permission.INTERNET
      - name: android.permission.ACCESS_NETWORK_STATE
      - name: android.permission.POST_NOTIFICATIONS
      - name: android.permission.MANAGE_EXTERNAL_STORAGE
      - name: android.permission.READ_EXTERNAL_STORAGE
      - name: android.permission.WRITE_EXTERNAL_STORAGE
        max_sdk_version: 28
    uses_feature:
      - name: android.hardware.type.pc
        required: false
